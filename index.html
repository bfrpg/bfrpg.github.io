<!DOCTYPE html>
<html lang="en">
<head>
    <title>BFRPG Collaborators Map</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="anonymous">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        #map {
            height: 100%;
            width: 100%;
        }
        .emoji-icon {
            font-size: 24px;
            text-align: center;
            line-height: 30px;
            background: transparent;
            border: none;
        }
        #map-error {
            display: none;
            padding: 1.5rem;
            font-family: system-ui, sans-serif;
            color: #b00020;
            background: #fff3f3;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="map-error">Sorry, the map could not be loaded. Please check your connection or try again later.</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="anonymous"></script>

    <script>
        // Collaborator data
        // Your name or nick must be listed in an officially released book (physical or PDF)
        const collaborators = [
            { location: [45.3565, -75.6555], name: 'Todd Lyons (toddlyons)' },
            { location: [43.0497, -76.1522], name: 'Rosisha' },
            { location: [42.2355, -97.0226], name: 'peelseel2' },
            { location: [41.7370, 111.8338], name: 'Dave Gerard (dave_gerard)' },
            { location: [40.1168, -91.9145], name: 'Chris Gonnerman (Solomoriah)' },
            { location: [38.0187, -122.1338], name: 'Leon Atkinson (leon)' },
            { location: [36.1299, -86.7437], name: 'R. K. Smoot (SmootRK)' },
            { location: [51.243, 22.573], name: 'Wing_department' },
            { location: [-22.337, -47.362], name: 'NathanRdS' },
            { location: [-35.1408, 138.4989], name: 'surfarcher' },
            { location: [45.4962, -73.5709], name: 'coureur_d_bois' },
            { location: [40.9736, -112.2150], name: 'TardisCaptain' }
        ];

        function initMap() {
            const mapEl = document.getElementById('map');
            const errorEl = document.getElementById('map-error');

            if (!mapEl || typeof L === 'undefined') {
                if (errorEl) errorEl.style.display = 'block';
                console.error('Leaflet failed to load or #map element is missing.');
                return;
            }

            try {
                const map = L.map('map', {
                    center: [37.5, -96.0],
                    zoom: 4,
                    minZoom: 2,
                    maxZoom: 18,
                    worldCopyJump: false
                });

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    noWrap: true,
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                }).addTo(map);

                // Optional: limit panning to roughly the inhabited world
                map.setMaxBounds([[-85, -180], [85, 180]]);

                const shieldIcon = L.divIcon({
                    html: '🛡️',
                    className: 'emoji-icon',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });

                collaborators.forEach(person => {
                    L.marker(person.location, { icon: shieldIcon })
                        .addTo(map)
                        .bindPopup(person.name);
                });

            } catch (error) {
                console.error('Error initializing map:', error);
                if (errorEl) errorEl.style.display = 'block';
                if (mapEl) mapEl.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
